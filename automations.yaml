- actions:
  - choose:
    - conditions:
      - condition: trigger
        id: activity_on
      sequence:
      - action: timer.start
        data:
          duration: 01:30:00
        target:
          entity_id: timer.bedroom_occupancy_hold
    - conditions:
      - condition: trigger
        id: hold_timer_finished
      - condition: state
        entity_id: binary_sensor.myggspray_wrlss_mtn_sensor_occupancy
        state: 'on'
      sequence:
      - action: timer.start
        data:
          duration: 01:30:00
        target:
          entity_id: timer.bedroom_occupancy_hold
      - if:
        - condition: state
          entity_id: input_boolean.bedroom_auto_on_enabled
          state: 'on'
        - condition: state
          entity_id: input_boolean.sleeping_mode
          state: 'off'
        - condition: state
          entity_id: input_boolean.focus_mode
          state: 'off'
        - condition: template
          value_template: "{{ expand('light.bedroom_lights')\n   | selectattr('state',\
            \ 'eq', 'on') | list | count == 0 }}\n"
        - below: 15
          condition: numeric_state
          entity_id: sensor.myggspray_wrlss_mtn_sensor_illuminance
        then:
        - action: light.turn_on
          data:
            brightness_pct: '{% set lux = states(''sensor.myggspray_wrlss_mtn_sensor_illuminance'')
              | float(999) %} {% set time = now().strftime(''%H:%M'') %} {% set hour
              = now().hour %} {% if time >= ''16:30'' %}100{% elif hour < 7 %}5{%
              elif lux < 15 %}60{% elif lux < 30 %}50{% else %}40{% endif %}'
            color_temp_kelvin: '{% set hour = now().hour %} {% if hour >= 20 or hour
              < 7 %}3500{% elif hour >= 16 %}3700{% else %}4000{% endif %}'
            transition: 1
          target:
            entity_id: light.bedroom_lights
    - conditions:
      - condition: trigger
        id: tv_changed
      - condition: template
        value_template: "{{ trigger.from_state is not none\n   and trigger.to_state\
          \ is not none\n   and (\n     trigger.from_state.state not in ['off', 'idle',\
          \ 'unavailable']\n     or trigger.to_state.state not in ['off', 'idle',\
          \ 'unavailable']\n   ) }}\n"
      sequence:
      - action: timer.start
        data:
          duration: 01:30:00
        target:
          entity_id: timer.bedroom_occupancy_hold
    - conditions:
      - condition: trigger
        id: plug_changed
      - condition: template
        value_template: "{{ trigger.from_state is not none\n   and trigger.to_state\
          \ is not none\n   and (\n     trigger.from_state.state == 'on'\n     or\
          \ trigger.to_state.state == 'on'\n   ) }}\n"
      sequence:
      - action: timer.start
        data:
          duration: 01:30:00
        target:
          entity_id: timer.bedroom_occupancy_hold
    - conditions:
      - condition: trigger
        id: automations_reenabled
      - condition: template
        value_template: "{{ expand('light.bedroom_lights')\n   | selectattr('state',\
          \ 'eq', 'on') | list | count > 0 }}\n"
      sequence:
      - action: timer.start
        data:
          duration: 01:30:00
        target:
          entity_id: timer.bedroom_occupancy_hold
