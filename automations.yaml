  conditions:
  - condition: state
    entity_id: input_boolean.automations_enabled
    state: 'on'
  - condition: state
    entity_id: input_boolean.sleeping_mode
    state: 'on'
  - condition: state
    entity_id: input_boolean.focus_mode
    state: 'off'
  - condition: or
    conditions:
    - condition: and
      conditions:
      - after: '10:00:00'
        condition: time
      - condition: time
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
    - condition: and
      conditions:
      - after: '11:00:00'
        condition: time
      - condition: time
        weekday:
        - sat
        - sun
