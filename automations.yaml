      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom_sleep_override_active
      - delay: '00:00:00.500'
      - repeat:
          count: 3
          sequence:
          - action: light.turn_on
            data:
              brightness_pct: 15
              rgb_color: '{% if is_state(''weather.forecast_home'', ''rainy'') %}
