            color_temp_kelvin: "{% set hour = now().hour %} {% if hour >= 20 or hour < 7 %}3500{% elif hour >= 16 %}3700{% else %}4000{% endif %}"
            transition: 1
          target:
            entity_id: light.bedroom_lights
