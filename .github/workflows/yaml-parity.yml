name: YAML Parity

on:
  pull_request:

jobs:
  yaml-parity:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PRIVATE_REPO_OWNER: ${{ vars.PRIVATE_YAML_REPO_OWNER }}
      PRIVATE_REPO_NAME: ${{ vars.PRIVATE_YAML_REPO_NAME }}
      PRIVATE_REPO: ${{ vars.PRIVATE_YAML_REPO_OWNER }}/${{ vars.PRIVATE_YAML_REPO_NAME }}
      PRIVATE_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Check out public repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether YAML parity applies
        id: parity-scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed_files="$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json files \
            --jq '.files[].path')"

          needs_parity=false
          while IFS= read -r path; do
            case "$path" in
              configuration.yaml|automations.yaml)
                needs_parity=true
                break
                ;;
            esac
          done <<EOF
          $changed_files
          EOF

          echo "needs_parity=$needs_parity" >> "$GITHUB_OUTPUT"

      - name: Skip parity for unrelated PRs
        if: ${{ steps.parity-scope.outputs.needs_parity != 'true' }}
        run: |
          echo "Skipping YAML parity: this PR does not change mirrored YAML files."

      - name: Validate private repo configuration
        if: ${{ steps.parity-scope.outputs.needs_parity == 'true' }}
        run: |
          if [ -z "$PRIVATE_REPO_OWNER" ] || [ -z "$PRIVATE_REPO_NAME" ]; then
            echo "::error::Missing PRIVATE_YAML_REPO_OWNER or PRIVATE_YAML_REPO_NAME repository variable."
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        if: ${{ steps.parity-scope.outputs.needs_parity == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PRIVATE_YAML_APP_ID }}
          private-key: ${{ secrets.PRIVATE_YAML_APP_PRIVATE_KEY }}
          owner: ${{ vars.PRIVATE_YAML_REPO_OWNER }}
          repositories: ${{ vars.PRIVATE_YAML_REPO_NAME }}

      - name: Verify private repo access
        if: ${{ steps.parity-scope.outputs.needs_parity == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if ! curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$PRIVATE_REPO" > /dev/null; then
            echo "::error::The parity check could not access the private YAML repo. This is a workflow/auth problem, not a content mismatch. Check GitHub App installation and repository permissions."
            exit 1
          fi

      - name: Verify matching private branch exists
        if: ${{ steps.parity-scope.outputs.needs_parity == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if ! curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$PRIVATE_REPO/branches/$PRIVATE_BRANCH" > /dev/null; then
            echo "::error::Matching private branch $PRIVATE_BRANCH was not found. Run \`uv run python scripts/yaml_flow.py push-private-branch\` locally to push the matching private branch."
            exit 1
          fi

      - name: Check out private repo
        if: ${{ steps.parity-scope.outputs.needs_parity == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          path: private-repo
          persist-credentials: false

      - name: Check YAML parity
        if: ${{ steps.parity-scope.outputs.needs_parity == 'true' }}
        run: |
          python scripts/check_yaml_parity.py \
            --public-repo . \
            --private-repo private-repo
